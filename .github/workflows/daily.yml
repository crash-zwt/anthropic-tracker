name: Daily Anthropic Tracker

on:
  schedule:
    - cron: "27 2 * * *"
    - cron: "7 1 * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      backfill_bootstrap:
        description: "Summarize links previously marked as bootstrap_only"
        required: false
        default: "false"
      max_new_articles:
        description: "Maximum articles to summarize in this run"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      XF_MAAS_API_KEY: ${{ secrets.XF_MAAS_API_KEY }}
      BACKFILL_BOOTSTRAP: ${{ github.event.inputs.backfill_bootstrap || 'false' }}
      MAX_NEW_ARTICLES_PER_RUN: ${{ github.event.inputs.max_new_articles || '6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check sources and summarize new articles
        run: python scripts/check_and_summarize.py

      - name: Render site
        run: python scripts/render_site.py

      - name: Verify site navigation
        run: python scripts/verify_site.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/index.html docs/categories/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily Anthropic tracker"
            git push
          fi
